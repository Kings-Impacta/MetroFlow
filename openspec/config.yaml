schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  MetroFlow é um planejador de viagens do transporte ferroviário metropolitano de São Paulo.
  O frontend é implementado exclusivamente com Reflex; o backend Python protege a sessão,
  valida entradas e normaliza as respostas. O Xano autentica usuários, armazena a malha e
  calcula os trajetos. A busca minimiza o tempo dos trechos mais 600 segundos por mudança
  de linha; em empate, prefere menos baldeações. A consulta exige sessão válida.
  Documentação e textos exibidos ao usuário devem estar em português do Brasil.
  Preserve identificadores técnicos de Python, Reflex, Xano, APIs e OpenSpec.
  Consulte docs/project-overview.md, docs/domain-model.md e AGENTS.md antes de propor mudanças.

rules:
  proposal:
    - Descrever o problema, o alcance e o que fica fora da mudança em português.
  design:
    - Explicar as decisões de integração entre Reflex, backend Python e Xano quando pertinentes.
  specs:
    - Registrar requisitos verificáveis e cenários para os comportamentos relevantes.
  tasks:
    - Escrever tarefas verificáveis e registrar testes e limites da validação.

operations:
  apply:
    guidance:
      - Preservar a sessão e impedir exposição de credenciais e tokens.
      - Executar testes pertinentes e registrar o resultado.
  archive:
    guidance:
      - Arquivar apenas mudanças concluídas e conferir as especificações consolidadas.
