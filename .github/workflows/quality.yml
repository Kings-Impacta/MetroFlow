name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar projeto e testes
        run: python -m pip install -e . pytest

      - name: Executar testes
        run: python -B -m pytest -q -p no:cacheprovider

  openspec:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar especificações
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive
